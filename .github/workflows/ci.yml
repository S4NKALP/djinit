name: CI

on:
  push:
    branches: [ main, develop, dev ]
  pull_request:
    branches: [ main, develop, dev ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-suffix: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Lint with Ruff
      run: |
        uv run ruff check src/djinit/

    - name: Check formatting with Ruff
      run: |
        uv run ruff format --check src/djinit/

    - name: Test CLI import
      run: |
        uv run python -c "from djinit.cli import main; print('Import successful')"

    - name: Test console script entry point
      run: |
        uv run djinit --help
